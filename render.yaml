services:
  - type: web
    name: town-ratusha-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: MAIN_CHAT_ID
        sync: false
      - key: LOG_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INTERCOM_SECRET_TOKEN
        generateValue: true
      - key: FINE_EXPIRATION_HOURS
        value: 48
      - key: FINE_DOUBLE_MULTIPLIER
        value: 2.0
