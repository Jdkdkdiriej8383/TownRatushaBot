version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: townbot_postgres
    restart: always
    environment:
      POSTGRES_USER: town_user
      POSTGRES_PASSWORD: town_password
      POSTGRES_DB: towndb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U town_user -d towndb"]
      interval: 5s
      timeout: 5s
      retries: 5

  townbot:
    build: .
    container_name: townbot_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://town_user:town_password@db:5432/towndb
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  pgdata:
